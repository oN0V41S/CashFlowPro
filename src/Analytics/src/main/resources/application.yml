server: 
  port: 5001

spring:
  application:
    name: analytics-service
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:cashflow}
    password: ${RABBITMQ_PASSWORD:cashflow_pass}
    listener:
      simple:
        acknowledge-mode: auto
        retry: 
          enabled: true
          max-attempts: 3
          initial-interval: 1000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms

analytics:
  cache:
    ttl-minutes: 60
  queue:
    transfer-completed: cashflow.transfer-completed
  exchange: 
    events: cashflow-exchange

logging:
  level:
    com.cashflow.analytics: DEBUG